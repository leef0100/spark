# Spark Dating App - Supabase Configuration

[project]
name = "spark"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://localhost:54321"

[storage]
enabled = true
file_size_limit = "1MB"

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["spark://"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.external.phone]
enabled = true

[auth.sms.twilio]
enabled = false
# Configure these in production:
# account_sid = ""
# message_service_sid = ""
# auth_token = ""

[functions]
verify_jwt = true

[realtime]
enabled = true
ip_version = "dual"

[analytics]
enabled = false

# Cron job for expiring stale matches
# Run every hour
[[cron_jobs]]
name = "expire-stale-matches"
schedule = "0 * * * *"
command = "SELECT expire_stale_matches()"
